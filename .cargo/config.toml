# Self-contained executables: statically link the C runtime so the exe has no
# dependency on the Visual C++ Redistributable (VCRUNTIME140.dll) or mingw DLLs.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
